# CD: .deb + .dmg built from latest master, published to the v1.0.0 tag.
#
# Runs on every push to master (plus manual dispatch). It builds the .deb
# on Linux and the .dmg on macOS (ad-hoc signed via mac.identity "-" in package.json;
# electron-builder does NOT fall back to ad-hoc on its own, and an unsigned
# arm64 app shows "is damaged" on macOS. No notarization.),
# then (re)publishes both to the v1.0.0 release, clobbering the previous
# assets — same pattern as ~/cairn's release.yml.
#
# No version automation: there is exactly one version, 1.0.0, and this
# file names it outright. Bump package.json + the tag below together.

name: Release 1.0.0

on:
  push:
    branches: [master]
  workflow_dispatch:

# Latest push wins: a newer run cancels the older one's build, and the
# publish step uploads with --clobber, so a cancelled run can never leave
# the release half-updated.
concurrency:
  group: release-1.0.0
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build the .deb
        run: npm run dist:deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  dmg:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the .dmg
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [deb, dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh release create tags v1.0.0, and tagging needs the git directory.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the v1.0.0 release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 \
              --title "Source Viewer 1.0.0" \
              --notes "Source Viewer 1.0.0 build from latest master. Debian: sudo apt install ./source-viewer_1.0.0_amd64.deb. macOS: open the .dmg (ad-hoc signed, no notarization)." \
              --latest
          fi
          gh release upload v1.0.0 ./*.deb ./*.dmg --clobber
